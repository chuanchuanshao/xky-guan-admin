<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XKY 管理面板</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 登录 -->
  <div id="login-screen">
    <div class="login-card">
      <h1>XKY 管理面板</h1>
      <p class="subtitle">guan.xkyframe.com</p>
      <form id="login-form">
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" name="username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">登录</button>
        <p id="login-error" class="error"></p>
      </form>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app-screen" class="hidden">
    <aside class="sidebar">
      <div class="brand">XKY 工厂管理</div>
      <button class="nav-btn active" data-page="page-dashboard">仪表盘</button>
      <button class="nav-btn" data-page="page-orders">订单</button>
      <button class="nav-btn" data-page="page-customers">客户</button>
      <button class="nav-btn" data-page="page-production">生产</button>
    </aside>
    <div class="main">
      <header class="topbar">
        <span>管理面板</span>
        <div>
          <span class="user" id="user-info"></span>
          <button class="btn btn-ghost" id="logout-btn" style="margin-left:.75rem">退出</button>
        </div>
      </header>
      <div class="content">
        <div id="page-dashboard" class="page">
          <h2>仪表盘</h2>
          <div id="dashboard-content"></div>
        </div>
        <div id="page-orders" class="page hidden">
          <h2>订单管理</h2>
          <div id="orders-content"></div>
        </div>
        <div id="page-customers" class="page hidden">
          <h2>客户管理</h2>
          <div id="customers-content"></div>
        </div>
        <div id="page-production" class="page hidden">
          <h2>生产任务</h2>
          <div id="production-content"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
